<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CityRideTaxi | Premium Access</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="config.js"></script>
    <style>
        .auth-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.7)), url('hero.png') no-repeat center center/cover;
            padding: 2rem;
        }

        .auth-card {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            padding: 4rem;
            border-radius: 30px;
            width: 100%;
            max-width: 500px;
            box-shadow: var(--shadow-lg);
        }

        .auth-tabs {
            display: flex;
            gap: 2rem;
            margin-bottom: 3rem;
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
            padding-bottom: 1rem;
        }

        .auth-tab {
            background: none;
            border: none;
            font-size: 1.25rem;
            font-weight: 700;
            cursor: pointer;
            color: var(--dark-charcoal);
            opacity: 0.4;
            transition: var(--transition);
        }

        .auth-tab.active {
            opacity: 1;
            color: var(--primary-red);
        }

        .auth-form {
            display: none;
        }

        .auth-form.active {
            display: block;
        }

        .auth-form .input-group {
            margin-bottom: 2rem;
        }

        .auth-footer {
            margin-top: 2rem;
            text-align: center;
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: 2rem;
            cursor: pointer;
            user-select: none;
        }

        .checkbox-group input {
            width: 20px;
            height: 20px;
            cursor: pointer;
            accent-color: var(--primary-red);
        }

        .checkbox-group label {
            font-size: 0.9rem;
            color: var(--text-muted);
            cursor: pointer;
        }

        .checkbox-group a {
            color: var(--primary-red);
            text-decoration: none;
            font-weight: 600;
        }

        .checkbox-group a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body style="overflow: hidden;"> <!-- Lock scroll during splash -->
    <div id="splash-screen">
        <div class="splash-content">
            <img src="cityridetaxi.png" alt="CityRide Premium Logo" class="splash-logo">
            <div class="loading-bar">
                <div class="loading-progress"></div>
            </div>
            <p class="splash-text">Verifying Security Protocols...</p>
        </div>
    </div>
    <div class="auth-container">
        <div class="auth-card">
            <div class="logo" style="margin-bottom: 3rem; text-align: center;">
                <img src="cityridetaxi.png" alt="CityRide Logo" style="height: 60px; width: auto; display: block; margin: 0 auto 1rem;">
                <span class="logo-accent">CityRide</span>Taxi
            </div>

            <div class="auth-tabs">
                <button class="auth-tab active" onclick="switchAuth('login')">Login</button>
                <button class="auth-tab" onclick="switchAuth('register')">Register</button>
            </div>

            <!-- Login Form -->
            <form id="login-form" class="auth-form active">
                <div class="input-group">
                    <label>Phone Number</label>
                    <input type="tel" id="login-phone" placeholder="+91 98765 43210" required pattern="[0-9+\-\s]{7,15}">
                </div>
                <div class="input-group">
                    <label>Password</label>
                    <input type="password" id="login-password" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn btn-primary btn-large">Login to CityRideTaxi</button>
                <div style="text-align: center; margin-top: 1.5rem; font-size: 0.85rem; opacity: 0.8;">
                    Are you a partner? <a href="driver-login.html" style="color: var(--primary-red); font-weight: 700; text-decoration: none; border-bottom: 1px solid transparent; transition: 0.3s;" onmouseover="this.style.borderBottomColor='var(--primary-red)'" onmouseout="this.style.borderBottomColor='transparent'">Driver Login</a>
                </div>
            </form>

            <!-- Register Form (Passenger Only) -->
            <form id="register-form" class="auth-form">
                <div class="input-group">
                    <label>Full Name</label>
                    <input type="text" id="reg-name" placeholder="John Doe" required>
                </div>
                <div class="input-group">
                    <label>Email Address</label>
                    <div style="display: flex; gap: 0.5rem;">
                        <input type="email" id="reg-email" placeholder="name@example.com" required style="flex: 3;">
                        <button type="button" id="otp-btn" class="btn btn-primary" style="flex: 1; padding: 0; font-size: 0.7rem; white-space: nowrap;" onclick="sendOTP()">Verify Email</button>
                    </div>
                </div>
                <!-- OTP Field (Hidden until Verify is clicked) -->
                <div class="input-group" id="otp-group" style="display: none;">
                    <label>Identity Verification Code (OTP)</label>
                    <input type="text" id="reg-otp" placeholder="Enter 6-digit code sent to email" maxlength="6">
                </div>
                <div class="input-group">
                    <label>Phone Number</label>
                    <input type="tel" id="reg-phone" placeholder="+91 98765 43210" required>
                </div>
                <div class="input-group">
                    <label>Password</label>
                    <input type="password" id="reg-password" placeholder="••••••••" required>
                </div>

                <div class="checkbox-group">
                    <input type="checkbox" id="reg-terms" required>
                    <label for="reg-terms">i have accept the <a href="terms.html" target="_blank">terms and conditions</a>.</label>
                </div>

                <button type="submit" class="btn btn-primary btn-large">Finalize Registration</button>
            </form>

            <div class="auth-footer" style="text-align: left;">
                <a href="index.html" class="btn-back" title="Back to Home">←</a>
            </div>
        </div>
    </div>

    <script>
        function toggleDriverFields() {
            const role = document.getElementById('reg-role').value;
            const fields = document.getElementById('driver-fields');
            fields.style.display = role === 'driver' ? 'block' : 'none';
        }

        function switchAuth(type) {
            document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.auth-form').forEach(f => f.classList.remove('active'));

            if (type === 'login') {
                document.querySelector('.auth-tab:nth-child(1)').classList.add('active');
                document.getElementById('login-form').classList.add('active');
            } else {
                document.querySelector('.auth-tab:nth-child(2)').classList.add('active');
                document.getElementById('register-form').classList.add('active');
            }
        }

        // Handle Login
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const data = {
                phone: document.getElementById('login-phone').value.trim(),
                password: document.getElementById('login-password').value
            };

            try {
                const res = await fetch(`${API_BASE_URL}/api/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                const result = await res.json();
                if (res.ok) {
                    // This is only for travelers/passengers
                    localStorage.setItem('cityride_member', JSON.stringify(result.user));
                    window.location.href = 'index.html';
                } else {
                    alert(result.error);
                }
            } catch (err) { alert(`Login failed at ${API_BASE_URL}/api/auth/login. Error: ${err.message}`); }
        });

        // --- OTP Verification Logic ---
        async function sendOTP() {
            const email = document.getElementById('reg-email').value;
            if (!email) return alert('Please enter your email first.');
            
            const btn = document.getElementById('otp-btn');
            btn.disabled = true;
            btn.textContent = 'Sending...';

            try {
                const res = await fetch(`${API_BASE_URL}/api/auth/send-otp`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });
                const result = await res.json();
                if (res.ok) {
                    alert('Verification code sent to your email!');
                    document.getElementById('otp-group').style.display = 'block';
                    btn.textContent = 'Resend OTP';
                } else {
                    alert(result.error);
                    btn.textContent = 'Retry Verify';
                }
            } catch (err) { alert(`Failed to send OTP to ${API_BASE_URL}/api/auth/send-otp. Error: ${err.message}`); }
            btn.disabled = false;
        }

        // Handle Register
        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const data = {
                name: document.getElementById('reg-name').value,
                email: document.getElementById('reg-email').value,
                phone: document.getElementById('reg-phone').value,
                password: document.getElementById('reg-password').value,
                otp: document.getElementById('reg-otp').value,
                role: 'user'
            };

            if (!data.otp) return alert('Please verify your email first.');
            if (!document.getElementById('reg-terms').checked) return alert('Please accept the terms and conditions.');

            try {
                const res = await fetch(`${API_BASE_URL}/api/auth/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                const result = await res.json();
                if (res.ok) {
                    alert('Identity Verified! Welcome to the CityRide Network. Please login.');
                    switchAuth('login');
                } else {
                    alert(result.error);
                }
            } catch (err) { alert(`Identity Verification failed at ${API_BASE_URL}/api/auth/register. Error: ${err.message}`); }
        });
    </script>
    <script>
        window.addEventListener('load', () => {
            const splash = document.getElementById('splash-screen');
            setTimeout(() => {
                splash.classList.add('splash-hidden');
                document.body.style.overflow = 'auto'; // Re-enable scroll
            }, 1500); // Shorter splash for auth
        });
    </script>
    <script src="alert.js"></script>
</body>

</html>
